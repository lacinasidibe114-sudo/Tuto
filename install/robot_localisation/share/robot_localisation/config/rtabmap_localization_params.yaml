# Paramètres pour le MODE LOCALISATION de RTAB-Map
# Le robot se localise dans une carte existante SANS la modifier
/**:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    approx_sync: true
    wait_for_transform: 0.5

    odom_tf_linear_variance: 0.001
    odom_tf_angular_variance: 0.001

    # ============ MODE LOCALISATION ============
    Mem/IncrementalMemory: "false"       # ← NE PAS ajouter de nœuds
    Mem/InitWMWithAllNodes: "true"       # ← charger toute la carte en mémoire
    # ===========================================

    # Registration par ICP (optimisé pour localisation)
    Reg/Strategy: "1"
    Reg/Force3DoF: "true"
    Icp/VoxelSize: "0.1"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0"
    Icp/PointToPlaneGroundNormalsUp: "0.9"
    Icp/MaxTranslation: "1.0"            # réduit : on est déjà localisé
    Icp/MaxCorrespondenceDistance: "0.5" # plus strict
    Icp/Iterations: "30"
    Icp/Epsilon: "0.001"
    Icp/CorrespondenceRatio: "0.1"       # plus permissif (déjà localisé)

    # Localisation globale
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "1"
    RGBD/OptimizeMaxError: "3.0"         # tolère des erreurs en localisation
    Optimizer/GravitySigma: "0"

    # Grille d'occupation 2D (pour Nav2)
    Grid/Sensor: "0"
    Grid/3D: "false"
    Grid/CellSize: "0.05"
    Grid/RangeMin: "0.2"
    Grid/RangeMax: "12.0"
    Grid/RayTracing: "true"
    Grid/MaxGroundHeight: "0.05"
    Grid/MaxObstacleHeight: "0.6"
    Grid/NormalsSegmentation: "true"